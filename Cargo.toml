[workspace]
resolver = "3"
members = ["crates/nt4-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tuffinmuffin/nt4-rs"
rust-version = "1.95"

[workspace.dependencies]
serde_json = "1"
rmpv = "1"
rmp = "0.8"
thiserror = "2"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
