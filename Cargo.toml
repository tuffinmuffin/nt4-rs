[workspace]
resolver = "3"
members = ["crates/nt4-proto", "crates/nt4-core", "crates/nt4", "crates/nt4-bench", "crates/nt4-fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tuffinmuffin/nt4-rs"
rust-version = "1.95"

[workspace.dependencies]
# float_roundtrip: parse numbers exactly, as ntcore does (the default parser
# can be off by one in the last place).
serde_json = { version = "1", features = ["float_roundtrip"] }
rmpv = "1"
rmp = "0.8"
thiserror = "2"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
