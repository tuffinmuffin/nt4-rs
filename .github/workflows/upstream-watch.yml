name: Upstream watch

# Once a week: has allwpilib released something newer than the commit we
# pin (ALLWPILIB_COMMIT in ci.yml), and if so, do our ported tests and
# nt4-wpimath's struct schemas still match it? A mismatch opens (or adds to)
# one issue labelled `upstream-watch` and fails the run. See
# scripts/upstream_audit.py and scripts/schema_audit.py.
#
# Only releases from 2027 on count (nt4 doesn't track ntcore 2026), and only
# one newer than the pin: an older release lacks cases we ported from the
# pin, which isn't news.
#
# A second job, `interop-latest`, runs the interop suites (interop,
# interop_server, conformance) against the newest 2027 pyntcore, not the
# version ci.yml pins, on Linux, Windows and macOS. It runs every week even
# when that is the pinned version, so a runner or Python change shows up
# too. A failure opens (or adds to) one issue labelled `interop-watch`.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "allwpilib tag or commit to audit (default: the newest 2027+ release, if newer than the pin)"
        required: false
      pyntcore:
        description: "pyntcore version for interop-latest (default: the newest 2027 release)"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the allwpilib release
        id: pick
        env:
          REF: ${{ inputs.ref }}
        run: |
          pin=$(sed -n 's/^ *ALLWPILIB_COMMIT: *//p' .github/workflows/ci.yml)
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          if [ -n "$REF" ]; then
            echo "Auditing $REF, as asked."
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh release list --repo wpilibsuite/allwpilib --exclude-drafts --limit 30 \
            --json tagName,publishedAt \
            --jq '[.[] | select((.tagName | ltrimstr("v") | split(".")[0] | tonumber? // 0) >= 2027)]
                  | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            echo "::notice::No allwpilib release from 2027 on yet."
            exit 0
          fi
          # Where the release stands against the pin: "ahead" (newer),
          # "identical", "behind" (older) or "diverged".
          status=$(gh api "repos/wpilibsuite/allwpilib/compare/$pin...$tag" --jq .status)
          echo "Newest release $tag is $status relative to the pin ${pin:0:10}."
          case "$status" in
            behind)
              echo "::notice::$tag is older than ALLWPILIB_COMMIT; nothing new to check."
              ;;
            identical)
              echo "::notice::$tag is the pinned commit; CI already checks it."
              ;;
            *)
              echo "ref=$tag" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        if: steps.pick.outputs.ref != ''
      - uses: Swatinem/rust-cache@v2
        if: steps.pick.outputs.ref != ''
      # The newest RobotPy, not the pinned one: it is the newest compiled
      # WPILib, for the schema audit's third comparison.
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.ref != ''
        with:
          python-version: "3.13"
      - if: steps.pick.outputs.ref != ''
        run: python -m pip install --pre --upgrade robotpy-wpimath robotpy-hal

      - name: Run both audits
        id: audit
        if: steps.pick.outputs.ref != ''
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          scripts/fetch_allwpilib.sh allwpilib "$REF"
          robotpy=$(pip show robotpy-wpimath | sed -n 's/^Version: //p')
          status=0
          {
            echo "## allwpilib \`$REF\` against nt4"
            echo
            echo "Pinned: \`${{ steps.pick.outputs.pin }}\` (ALLWPILIB_COMMIT in ci.yml). RobotPy: robotpy-wpimath $robotpy."
            echo
            echo "### ntcore test cases (scripts/upstream_audit.py)"
            echo
            echo '```'
          } > report.md
          python scripts/upstream_audit.py allwpilib >> report.md 2>&1 || status=1
          {
            echo '```'
            echo
            echo "### Struct schemas (scripts/schema_audit.py)"
            echo
            echo '```'
          } >> report.md
          python scripts/schema_audit.py allwpilib --robotpy "$(python -c 'import sys; print(sys.executable)')" >> report.md 2>&1 || status=1
          echo '```' >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$status" >> "$GITHUB_OUTPUT"

      - name: Open or update the upstream-watch issue
        if: steps.audit.outputs.failed == '1'
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          gh label create upstream-watch --color c5def5 \
            --description "allwpilib changed something nt4 follows" 2>/dev/null || true
          {
            echo "The weekly upstream watch found differences. To follow them: port or list the"
            echo "new test cases (scripts/upstream_na.txt), fix or list the struct types"
            echo "(scripts/schema_audit.txt), then bump ALLWPILIB_COMMIT in ci.yml (and the"
            echo "ported tests' headers). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat report.md
          } > issue.md
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream-watch \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file issue.md
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --title "Upstream watch: allwpilib $REF"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label upstream-watch \
              --title "Upstream watch: allwpilib $REF" --body-file issue.md
          fi
          echo "::error::allwpilib $REF differs from what nt4 follows; see the upstream-watch issue."
          exit 1

  interop-latest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pyntcore
        shell: bash
        env:
          WANT: ${{ inputs.pyntcore }}
        run: |
          if [ -n "$WANT" ]; then
            python -m pip install --pre "pyntcore==$WANT"
          else
            python -m pip install --pre --upgrade "pyntcore>=2027,<2028"
          fi
          python -c "import ntcore; print('pyntcore', ntcore.__version__)"
      - name: Interop tests
        shell: bash
        run: |
          NT4_INTEROP_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export NT4_INTEROP_PYTHON
          version=$(python -c 'import ntcore; print(ntcore.__version__)')
          pinned=$(sed -n 's/.*pyntcore==\([^ ]*\).*/\1/p' .github/workflows/ci.yml | head -n 1)
          status=0
          # --no-fail-fast: one failing suite mustn't hide the others' results.
          cargo test -p nt4 --all-features --no-fail-fast \
            --test interop --test interop_server --test conformance \
            -- --test-threads=1 > test.log 2>&1 || status=$?
          {
            echo "### ${{ matrix.os }}: pyntcore $version (ci.yml pins $pinned)"
            echo
            if [ "$status" = 0 ]; then
              echo "All interop tests passed."
            else
              echo "Failed:"
              echo
              echo '```'
              # The failing tests and what each said (the line after "panicked
              # at" is the message), without the build noise.
              grep -E -A1 "panicked at" test.log | grep -v -E "^--$|^note:" > why.txt || true
              grep -E "^test .* FAILED|^test result|^  step" test.log > failed.txt || true
              cat failed.txt why.txt | head -n 150
              echo '```'
            fi
          } > report-${{ matrix.os }}.md
          cat report-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-report-${{ matrix.os }}
          path: report-${{ matrix.os }}.md

  interop-issue:
    needs: interop-latest
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: interop-report-*
          merge-multiple: true
      - name: Open or update the interop-watch issue
        run: |
          gh label create interop-watch --repo "$GITHUB_REPOSITORY" --color f9d0c4 \
            --description "nt4 against the newest pyntcore failed" 2>/dev/null || true
          version=$(sed -n 's/.*pyntcore \([^ ]*\) (ci.yml.*/\1/p' report-*.md | head -n 1)
          {
            echo "The weekly interop run against the newest pyntcore failed. If the new"
            echo "ntcore behaves differently, follow it (a conformance scenario shows what it"
            echo "does) and then bump the pyntcore pin in ci.yml."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat report-*.md
          } > issue.md
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label interop-watch \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file issue.md
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --title "Interop watch: pyntcore $version"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label interop-watch \
              --title "Interop watch: pyntcore $version" --body-file issue.md
          fi
