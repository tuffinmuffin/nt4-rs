name: Release

# Publishes the five library crates to crates.io and creates a GitHub
# release from the version's CHANGELOG.md section. Two ways in (see
# "Releasing" in README.md):
#
# - Usually: merge the "Release <version>" PR that prepare-release.yml
#   opens. When CI then passes on main, this runs (workflow_run), sees that
#   the crates' version has no tag yet, tags that commit `v<version>` and
#   publishes. A CI run on main whose version is already tagged does nothing.
# - By hand: push a tag `v<version>` on a commit on main.
#
# crates.io trusts this file (by name) in the Deploy environment, so
# publishing stays here.

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time; never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # In the order crates.io needs them: each depends only on those before it.
  CRATES: nt4-proto nt4-core nt4-derive nt4 nt4-wpimath

jobs:
  # Everything that can stop a bad release, before anything is published.
  check:
    # From CI: only a passed run of a push to main (not a pull request).
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to read the CI run of the tagged commit
    env:
      # The commit to release: the tagged one, or the one CI passed on.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ env.SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: The version to release, and its tag
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nt4") | .version')
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $version. Bump the version in Cargo.toml (or fix the tag)."
              exit 1
            fi
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # The usual case: CI passed on main, nothing new to release.
            echo "$tag is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "main is at $version, which has no tag yet: releasing $tag."
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          for c in $CRATES; do
            v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$c" '.packages[] | select(.name == $c) | .version')
            if [ "$v" != "$version" ]; then
              echo "::error::$c is version $v, not $version. All five crates share one version."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The commit is on main
        if: steps.version.outputs.release == 'true'
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA isn't on main. Release a commit on main."
            exit 1
          fi

      - name: CHANGELOG.md has a section for this version
        if: steps.version.outputs.release == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          if ! grep -qE "^## $version( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Rename 'Unreleased' to it before tagging."
            exit 1
          fi

      # CI on main runs the tests on three OSes, the interop tests against
      # ntcore and the MSRV build. Wait for that run on this commit and
      # require it to have passed, rather than repeating it here.
      - name: CI passed on this commit
        # From workflow_run it already has; a pushed tag waits for it.
        if: steps.version.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "No CI run for $SHA yet; waiting."
            elif [ "$(jq -r .status <<<"$run")" != completed ]; then
              echo "CI is still running: $(jq -r .url <<<"$run")"
            elif [ "$(jq -r .conclusion <<<"$run")" = success ]; then
              echo "CI passed: $(jq -r .url <<<"$run")"
              exit 0
            else
              echo "::error::CI didn't pass on this commit ($(jq -r .conclusion <<<"$run")): $(jq -r .url <<<"$run")"
              exit 1
            fi
            sleep 60
          done
          echo "::error::Gave up waiting for CI on $SHA after 90 minutes."
          exit 1

      - run: cargo publish --workspace --dry-run
        if: steps.version.outputs.release == 'true'

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    # crates.io trusts this repository's release.yml in the Deploy
    # environment (each crate's Settings > Trusted Publishing on crates.io).
    # The environment's protection rules (if any) apply here.
    environment: Deploy
    permissions:
      contents: write # to create the GitHub release
      id-token: write # for the crates.io trusted publishing token
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable

      # From a merged release PR there's no tag yet: make it on the commit
      # CI passed on. (A tag pushed with this workflow's token doesn't start
      # this workflow again.)
      - name: Tag the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already."
          else
            git tag "$TAG" "$SHA"
            git push origin "$TAG"
          fi

      # A crates.io token for this run only (it lasts 30 minutes and is
      # revoked when the job ends), instead of a long-lived secret.
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth

      # One crate at a time, skipping any this version already has on
      # crates.io, so a run that failed partway can simply be re-run.
      # (cargo publish waits for each crate to appear in the index before
      # the next one, which needs it, is published.)
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for c in $CRATES; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "nt4-rs release workflow (https://github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$c/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$c $VERSION is already on crates.io; skipping."
              continue
            fi
            cargo publish -p "$c"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # This version's CHANGELOG section, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Crates: $(for c in $CRATES; do printf '[%s](https://crates.io/crates/%s/%s) ' "$c" "$c" "$VERSION"; done)"
          } >> notes.md
          # A version with a `-` (0.2.0-alpha.1) is a pre-release; any other
          # is a normal release and becomes the repository's latest.
          case "$VERSION" in
            *-*) prerelease=true latest=false ;;
            *) prerelease=false latest=true ;;
          esac
          args=(--title "nt4 $VERSION" --notes-file notes.md
                --prerelease="$prerelease" --latest="$latest")
          # A release made first in GitHub's web page (which also makes the
          # tag) gets the same title, flags and notes, and is published if
          # it was left as a draft.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}" --draft=false
          else
            gh release create "$TAG" "${args[@]}" --verify-tag
          fi
