name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # allwpilib commit the ported tests come from. Bump it together with the tests.
  ALLWPILIB_COMMIT: 4ccfe967ba1903b1f409b04b99db0922dd3b7318

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --all-features: nt4's client and server are both optional.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The crates still package and build from what crates.io would get.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Its own, uncached target dir: the dry run builds our crates from a
      # temporary registry, and cargo never rebuilds a registry crate whose
      # version it has built before, so a cached target would check this
      # commit's crates against an older commit's nt4 0.x.y.
      - run: cargo publish --workspace --dry-run
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target

  # nt4-proto and nt4-core must stay free of sockets and runtimes so they
  # build for the browser.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nt4-proto -p nt4-core --target wasm32-unknown-unknown

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # nt4-fuzz and nt4-perf are dev tools (publish = false) with their own,
      # newer rust-version (1.91 and 1.88).
      - run: cargo test --workspace --all-features --exclude nt4-fuzz --exclude nt4-perf

  # Our client against a real ntcore server, and real ntcore clients against
  # our server (pyntcore). Pin the version so a
  # WPILib change shows up as a named failure here.
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --pre pyntcore==2027.0.0a8
      - name: Interop tests
        shell: bash
        run: |
          export NT4_INTEROP_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo test -p nt4 --all-features --test interop --test interop_server -- --test-threads=1

  # Differential fuzzer: nt4-proto's decoders against ntcore's own, from the
  # pyntcore wheel (the oracle builds on Linux only). A short bounded run as
  # a regression check; the seed is the run id, printed first, so a failure
  # reproduces locally with --seed. Mismatches fail the job and are uploaded.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --pre pyntcore==2027.0.0a8
      - name: Build with the ntcore oracle
        run: |
          echo "NT4_NTCORE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: cargo build --release -p nt4-fuzz
      - name: Fuzz for 60 seconds
        run: |
          ./target/release/nt4-fuzz --seconds 60 --seed ${{ github.run_id }} --out fuzz-findings | tee fuzz.log
          # Without the oracle the fuzzer still runs, so check it was built in.
          grep -q "oracle: ntcore" fuzz.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-findings
          if-no-files-found: ignore

  # Performance regressions: count CPU instructions (Callgrind, through
  # gungraun) for the hot paths in crates/nt4-perf, on the base branch and on
  # this PR, in the same job. Counts don't depend on how busy the runner is.
  # A benchmark more than 10% slower than the base gives a warning; more than
  # 50% fails the job.
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GUNGRAUN_RUNNER_VERSION: 0.20.0 # must match gungraun in crates/nt4-perf
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - run: cargo install gungraun-runner --version "$GUNGRAUN_RUNNER_VERSION" --locked
      - name: Benchmark the base branch
        id: base
        run: |
          git worktree add -q ../base "${{ github.event.pull_request.base.sha }}"
          if [ -d ../base/crates/nt4-perf ]; then
            (cd ../base && cargo bench -p nt4-perf --bench hot_paths -- --save-baseline=base)
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base branch has no crates/nt4-perf yet; nothing to compare."
          fi
      - name: Benchmark this PR
        # The base was built into the same target directory, and Cargo then
        # treats these packages as fresh: without the clean this step reruns
        # the base's binary. (The saved baselines in target/gungraun stay.)
        run: |
          cargo clean --release -p nt4-proto -p nt4-core -p nt4-perf
          cargo bench -p nt4-perf --bench hot_paths -- --save-baseline=pr
      - name: Compare with the base (warn over 10%, fail over 50%)
        if: steps.base.outputs.have == 'true'
        run: |
          compare() {
            cargo bench -q -p nt4-perf --bench hot_paths -- \
              --load-baseline=pr --baseline=base --callgrind-limits="ir=$1"
          }
          if ! compare 10% > compare.txt 2>&1; then
            cat compare.txt
            # Each regression is a benchmark name line, then the limit it broke.
            awk '/exceeds limit/ { gsub(/^ +/, "", prev); gsub(/^ +/, "", $0);
              print "::warning title=Performance regression::" prev " " $0 } { prev = $0 }' compare.txt
          fi
          compare 50%

  # Test coverage of the library crates (cargo-llvm-cov), with the pyntcore
  # interop tests. The report goes in the job summary; on a PR it also shows
  # the change from the base branch, and goes in one PR comment that each
  # push updates. The HTML report is uploaded as an artifact.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      COV_ARGS: -p nt4-proto -p nt4-core -p nt4-derive -p nt4 -p nt4-wpimath -p nt4-photon --all-features --ignore-filename-regex (tests|examples|benches)/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --pre pyntcore==2027.0.0a8
      - run: echo "NT4_INTEROP_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Measure this commit
        run: |
          cargo llvm-cov $COV_ARGS --json --summary-only --output-path coverage.json -- --test-threads=1
          cargo llvm-cov report --html --ignore-filename-regex '(tests|examples|benches)/'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add -q ../base "${{ github.event.pull_request.base.sha }}"
          (cd ../base && cargo llvm-cov $COV_ARGS --json --summary-only \
              --output-path "$GITHUB_WORKSPACE/base.json" -- --test-threads=1) \
            || echo "::warning::Could not measure the base branch; the report has no comparison."
      - name: Write the report
        run: |
          python3 scripts/coverage_summary.py coverage.json base.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      # Fork PRs get a read-only token, so they only have the job summary.
      - name: Post or update the PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- nt4-coverage -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@coverage.md > /dev/null
          else
            gh pr comment "$PR" --body-file coverage.md
          fi

  # Every tracked ntcore test case is ported or listed as not applicable,
  # and nt4-wpimath's struct schemas match WPILib's (scripts/schema_audit.py).
  upstream-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RobotPy, the same version as the interop tests' pyntcore, for the
      # schema audit's third comparison (compiled WPILib, not a parse).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --pre robotpy-wpimath==2027.0.0a8 robotpy-hal==2027.0.0a8
      - name: Fetch ntcore tests and WPILib's struct types at the pinned commit
        run: scripts/fetch_allwpilib.sh allwpilib "$ALLWPILIB_COMMIT"
      - run: python scripts/upstream_audit.py allwpilib
      - run: python scripts/schema_audit.py allwpilib --robotpy "$(python -c 'import sys; print(sys.executable)')"
      - name: Compare with allwpilib main (informational)
        continue-on-error: true
        run: |
          scripts/fetch_allwpilib.sh allwpilib-main main
          status=0
          python scripts/upstream_audit.py allwpilib-main || { echo "::warning::ntcore main has test changes not ported yet"; status=1; }
          python scripts/schema_audit.py allwpilib-main || { echo "::warning::WPILib main has struct changes nt4-wpimath doesn't match"; status=1; }
          exit $status
