[package]
name = "nt4"
description = "Unofficial NetworkTables 4.1 (NT4) client and server for Rust and tokio, compatible with WPILib's ntcore: typed topics, structs, time sync, reconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/nt4"
readme = "README.md"
keywords = ["frc", "networktables", "wpilib", "nt4", "robotics"]
categories = ["network-programming", "asynchronous", "science::robotics"]

[features]
default = ["client"]
## The NT4 client.
client = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
## The NT4 server.
server = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
nt4-proto = { path = "../nt4-proto", version = "0.1.0" }
nt4-core = { path = "../nt4-core", version = "0.1.0" }
tokio = { version = "1.47", features = ["rt", "net", "time", "sync", "macros", "io-util"], optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[example]]
name = "server"
required-features = ["server"]
