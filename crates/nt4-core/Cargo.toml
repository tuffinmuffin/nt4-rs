[package]
name = "nt4-core"
description = "Unofficial NetworkTables 4.1 (NT4) client and server state machines for Rust, with no sockets or clock (sans-I/O), behaving as WPILib's ntcore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/nt4-core"
readme = "README.md"
keywords = ["frc", "networktables", "wpilib", "nt4", "sans-io"]
categories = ["network-programming", "science::robotics"]

[dependencies]
nt4-proto = { path = "../nt4-proto", version = "0.2.0" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tungstenite = "0.30"

[lints]
workspace = true
